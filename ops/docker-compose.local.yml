name: kenakata-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kenakata
      POSTGRES_USER: kenakata
      POSTGRES_PASSWORD: kenakata_local
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenakata -d kenakata"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.19
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: kenakata_dev_meilisearch_key_32chars
    ports:
      - "7700:7700"
    volumes:
      - ../data/meilisearch:/meili_data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: kenakata
      MINIO_ROOT_PASSWORD: kenakata_local_s3_secret
    ports:
      - "9002:9000"   # API on 9002 (9000 used by storefront)
      - "9003:9003"   # Console on 9003 (9001 used by admin)
    volumes:
      - ../data/minio:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
